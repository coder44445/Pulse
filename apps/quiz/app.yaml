# apps/quiz/app.yaml
name: quiz

# Tier 2 — on-demand: cold-started by proxy on first request.
tier: 2

stacks:
  backend:
    compose: ../open-quiz-svc/docker-compose.yml

dependencies:
  - persona
  - core-infra

idle_timeout: 10m

health:
  backend: http://localhost:8000/healthz

routes:
  - /api/quiz